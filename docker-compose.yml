version: '3.8'

services:
  # ==========================================
  # Distributed Tracing - Zipkin (Port 9411)
  # ==========================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: driveeasy-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    restart: unless-stopped
    networks:
      - driveeasy-network

  # Note : Conformément aux spécifications strictes du cahier des charges :
  # "Les données seront chargées uniquement en RAM (l'utilisation de bases de données est strictement interdit)."
  # Les microservices fonctionnent avec des dépôts in-memory haute performance (ConcurrentHashMap).

networks:
  driveeasy-network:
    driver: bridge
