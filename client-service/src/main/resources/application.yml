# Configuration locale minimale : tout le reste (port, Eureka, Zipkin, routes,
# propriétés métier) est fourni par le Config Server (dépôt driveeasy-config).
# L'import n'est PAS optionnel : sans Config Server, le service refuse de démarrer.
spring:
  application:
    name: client-service
  profiles:
    # dev par défaut ; prod : SPRING_PROFILES_ACTIVE=prod (voir driveeasy-config/application-prod.yml)
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
